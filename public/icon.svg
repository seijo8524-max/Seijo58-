<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Inner Badge Container -->
  <circle cx="256" cy="230" r="150" fill="#1e293b" stroke="url(#redGrad)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="256" cy="230" r="136" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Large 58 Monogram -->
  <!-- Red Shadow Text -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="132" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">58</text>
  <!-- Main White Text -->
  <text x="254" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="132" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">58</text>

  <!-- Accent Star Top -->
  <polygon points="256,110 262,126 278,126 265,136 270,152 256,142 242,152 247,136 234,126 250,126" fill="#fbbf24"/>

  <!-- Lower Branding Pill -->
  <rect x="96" y="388" width="320" height="68" rx="34" fill="url(#redGrad)" filter="url(#shadow)"/>
  <rect x="98" y="390" width="316" height="64" rx="32" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.5"/>
  
  <text x="256" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SEIJO58 BET</text>
</svg>
